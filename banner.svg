<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Oscar Garay · Cyb3rPendragon · Especialista en ciberseguridad" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Oscar Garay · Cyb3rPendragon</title>
  <defs>
    <radialGradient id="g1" cx="0.12" cy="0.1" r="0.9"><stop offset="0" stop-color="#73d6ae" stop-opacity=".16"/><stop offset=".6" stop-color="#73d6ae" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.9" cy="0.95" r="0.8"><stop offset="0" stop-color="#6ea6ec" stop-opacity=".2"/><stop offset=".6" stop-color="#6ea6ec" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1d2631" stroke-width="1"/></pattern>
    <style>
      .t{fill:none;stroke:#73d6ae;stroke-width:1.6;stroke-dasharray:3 6;opacity:.6;animation:fluir 1.8s linear infinite}
      .gap{fill:none;stroke:#ff8f86;stroke-width:1.8;stroke-dasharray:2 5;animation:fluir 1.8s linear infinite,parpadeo 2.4s ease-in-out infinite}
      .d{fill:#73d6ae;transform-box:fill-box;transform-origin:center;animation:latir 3s ease-in-out infinite}
      .d2{animation-delay:.4s}.d3{animation-delay:.8s}.d4{animation-delay:1.2s}.d5{animation-delay:1.6s}.d6{animation-delay:2s}
      .lupa{animation:rastrear 10s ease-in-out infinite}
      .cur{animation:parpadeo 1.1s steps(1) infinite}
      @keyframes fluir{to{stroke-dashoffset:-18}}
      @keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
      @keyframes parpadeo{0%,100%{opacity:.25}50%{opacity:1}}
      @keyframes rastrear{0%,100%{transform:translate(0,0)}30%{transform:translate(-70px,40px)}60%{transform:translate(-150px,70px)}80%{transform:translate(-40px,10px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#11161c"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity=".55"/>
  <rect width="1200" height="300" rx="18" fill="url(#g1)"/>
  <rect width="1200" height="300" rx="18" fill="url(#g2)"/>
  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="17.5" fill="none" stroke="#28323e" stroke-width="1.5"/>

  <text x="64" y="92" fill="#73d6ae" font-family="Consolas,'Courier New',monospace" font-size="17">$ whoami<tspan class="cur" fill="#73d6ae"> ▍</tspan></text>
  <text x="62" y="152" fill="#e3e9ef" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" letter-spacing="-1">Oscar Garay</text>
  <text x="64" y="192" fill="#6ea6ec" font-family="Consolas,'Courier New',monospace" font-size="22">Cyb3rPendragon</text>
  <text x="64" y="240" fill="#93a1b0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19">Especialista en ciberseguridad · DFIR · Herramientas forenses en español</text>

  <path class="t" d="M760 250 C800 220 820 200 860 195 S920 180 940 150"/>
  <path class="gap" d="M940 150 C960 125 985 115 1005 100"/>
  <path class="t" d="M1005 100 C1030 80 1060 72 1110 50"/>
  <circle class="d" cx="760" cy="250" r="4"/>
  <circle class="d d2" cx="860" cy="195" r="4.5"/>
  <circle class="d d3" cx="940" cy="150" r="5"/>
  <circle class="d d4" cx="1005" cy="100" r="5"/>
  <circle class="d d5" cx="1060" cy="70" r="5.5"/>
  <circle class="d d6" cx="1110" cy="50" r="6"/>
  <text x="850" y="122" fill="#ff8f86" font-family="Consolas,'Courier New',monospace" font-size="12" opacity=".85">registro borrado</text>
  <g class="lupa">
    <circle cx="1060" cy="170" r="46" fill="#18202a" fill-opacity=".55" stroke="#6ea6ec" stroke-width="8"/>
    <line x1="1094" y1="204" x2="1130" y2="240" stroke="#6ea6ec" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
